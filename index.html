<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>당직 관리 시스템</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- 엑셀 파일 읽기/쓰기 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  
  <!-- Firebase SDK 스크립트 추가 (호환용) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <!-- 🌟 관리자 비밀번호 입력 모달창 (별표(*) 마스킹 적용) -->
  <div id="authModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; justify-content: center; align-items: center;">
    <div style="background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 300px; text-align: center;">
      <h3 style="margin-bottom: 15px; color: #333; font-size: 18px;">🔒 관리자 인증</h3>
      <p style="font-size: 13px; color: #666; margin-bottom: 15px;">관리자 비밀번호를 입력해 주세요.</p>
      <input type="password" id="modalPassword" placeholder="비밀번호 입력" style="width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; margin-bottom: 15px; text-align: center;">
      <button onclick="submitAdminPassword()" style="width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: bold;">확인</button>
    </div>
  </div>

  <!-- 📋 당직 변경 이력 모달창 -->
  <div id="historyModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
    <div style="background: white; padding: 20px; border-radius: 10px; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto;">
      <h3>📜 당직 변경 이력</h3>
      <div id="historyListContainer" style="margin-top: 15px; font-size: 14px; color: #333;">
        <!-- 이력 데이터가 동적으로 들어가는 곳 -->
        <p>이력을 불러오는 중...</p>
      </div>
      <button onclick="closeHistoryModal()" style="margin-top: 20px; width: 100%; padding: 10px; background: #dc3545; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">닫기</button>
    </div>
  </div>

  <div class="container">
    <h1>📅 당직 관리 시스템</h1>

    <!-- 1. 개별 직접 등록 구역 -->
    <div class="card">
      <h3>✏️ 개별 직접 등록</h3>
      
      <div class="form-row" style="display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 10px;">
        <div class="form-group" style="flex: 1; min-width: 120px; margin-bottom: 0;">
          <label for="dutyDate">날짜 선택</label>
          <input type="date" id="dutyDate">
        </div>
        <div class="form-group" style="flex: 1; min-width: 100px; margin-bottom: 0;">
          <label for="partSelect">파트 선택</label>
          <select id="partSelect">
            <option value="무선">무선</option>
            <option value="고객">고객</option>
            <option value="유선1">유선1</option>
            <option value="유선2">유선2</option>
            <option value="보안">보안</option>
            <option value="현장점검">현장점검</option>
          </select>
        </div>
        <div class="form-group" style="flex: 1.5; min-width: 130px; margin-bottom: 0;">
          <label for="workerName">당직자 이름</label>
          <input type="text" id="workerName" placeholder="예: 홍길동">
        </div>
      </div>

      <button id="registerBtn" type="button" style="width: 100%;">당직 등록하기</button>
    </div>
    
    <!-- 2. 당직 표 구역 (중앙 배치) -->
    <div class="card">
      <h3>📋 당직 현황표</h3>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>날짜</th>
              <th>무선</th>
              <th>고객</th>
              <th>유선1</th>
              <th>유선2</th>
              <th>보안</th>
              <th>현장점검</th>
            </tr>
          </thead>
          <tbody id="dutyTableBody">
            <!-- 자바스크립트로 데이터가 추가됩니다 -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- 3. 엑셀 업로드 및 다운로드 구역 -->
    <div class="card excel-card">
      <h3>📁 엑셀 파일 관리</h3>
      <p class="excel-guide">엑셀 첫 행의 열 이름을 <b>[날짜, 무선, 고객, 유선1, 유선2, 보안, 현장점검]</b>로 맞추어 업로드해 주세요.</p>
      <div class="excel-upload-group">
        <input type="file" id="excelFile" accept=".xlsx, .xls">
        <!-- 🌟 엑셀 업로드 및 다운로드 버튼을 나란히 배치하기 위한 그룹 클래스 적용 -->
        <div class="excel-btn-group">
          <button id="excelBtn" type="button">엑셀 업로드</button>
          <button id="downloadExcelBtn" type="button">엑셀 다운로드</button>
        </div>
      </div>
    </div>

    <!-- 4. 변경 이력 확인 버튼 구역 -->
    <div class="card" style="text-align: center;">
      <button id="historyBtn" type="button" onclick="openHistoryModal()">변경 이력</button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
